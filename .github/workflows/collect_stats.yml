name: Collect app installation stats

on:
  schedule:
    # 1:00am Monday, Mountain time //  2:00am daylight savings
    - cron: '0 8 * * 1'
  workflow_dispatch: ~

concurrency:
  group: collect-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 120
    steps:
      - uses: $/.github/actions/setup

      - name: Collect install stats
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: node scripts/collect-stats.mjs

      - name: Commit the CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usage.csv data/top-accounts.csv
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): record install stats for $(date -u +%F)"
          git pull --rebase origin main
          git push
