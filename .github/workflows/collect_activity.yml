name: Collect bot pull request counts

on:
  schedule:
    # 1:00am Saturday, Mountain time // 2:00am daylight savings
    - cron: '0 8 * * 6'
  workflow_dispatch: ~

concurrency:
  group: collect-activity
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: $/.github/actions/setup

      # The search API only reads public data, so the workflow token is enough.
      - name: Count bot pull requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/collect-activity.mjs

      - name: Commit the CSV file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bot-prs-weekly.csv
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): record bot pull request counts for $(date -u +%F)"
          git pull --rebase origin main
          git push
