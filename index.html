<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Contributors bot usage</title>
  <style>
    :root {
      color-scheme: light;
      --surface-1: #fcfcfb;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --grid: #e4e3df;
      --series-1: #2a78d6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --surface-1: #1a1a19;
        --text-primary: #f0efec;
        --text-secondary: #c3c2b7;
        --grid: #33332f;
        --series-1: #3987e5;
      }
    }
    body {
      margin: 0 auto;
      max-width: 960px;
      padding: 2rem 1rem;
      font-family: system-ui, sans-serif;
      background: var(--surface-1);
      color: var(--text-primary);
      /* Plot draws its tooltip background with this variable */
      --plot-background: var(--surface-1);
    }
    h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
    .subtitle { color: var(--text-secondary); margin: 0 0 1.5rem; }
    figure { margin: 0; }
    figure svg { overflow: visible; }
    details { margin-top: 1.5rem; color: var(--text-secondary); }
    table { border-collapse: collapse; margin-top: 0.5rem; font-variant-numeric: tabular-nums; }
    th, td { padding: 0.2rem 1rem 0.2rem 0; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
  </style>
</head>
<body>
  <h1>Accounts using the All Contributors bot</h1>
  <p class="subtitle">
    Active installations over time. Each installation is one GitHub user or
    organization. Hover over the chart to see daily values.
  </p>
  <figure id="installations-chart"></figure>
  <details>
    <summary>Show the data as a table</summary>
    <table id="installations-table">
      <thead><tr><th>Date</th><th>Active installations</th></tr></thead>
      <tbody></tbody>
    </table>
  </details>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
